[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p_ml_swarm"
version = "0.1.0"
description = "Decentralized P2P Machine Learning Swarm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Author", email = "author@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "hivemind>=1.1.10",
    "bitsandbytes>=0.41.0",
    "safetensors>=0.4.0",
    "requests>=2.31.0",
    "boto3>=1.28.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "tensorboard>=2.14.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["p2p_ml_swarm*"]

[project.scripts]
p2p-ml-bootnode = "p2p_ml_swarm.bootnode:main"

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

